name: EARTrip
options:
  minimumXcodeGenVersion: 2.42.0
  bundleIdPrefix: com.eartrip
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  EARTrip:
    type: application
    platform: iOS
    sources:
      - path: EARTrip
        excludes:
          - Resources
      - path: EARTrip/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eartrip.app
        PRODUCT_NAME: EARTrip
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: EARTrip/Resources/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        VERSIONING_SYSTEM: apple-generic
      configs:
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  EARTripTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: EARTrip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eartrip.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EARTrip:
    management:
      shared: true
    build:
      targets:
        EARTrip: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: EARTripTests
    archive:
      config: Release
